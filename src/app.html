<!doctype html>
<html lang="en" class="darkModeFade bg-bglight-1 dark:bg-bgdark-1 overscroll-none">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#242728" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#d7d9db" media="(prefers-color-scheme: light)" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="robots" content="all" />
        <meta name="google-site-verification" content="Xo2VwT-4sh7qVY0j0u_d43mOPLAAED71Dyne_gVFcSo" />
        <meta name="msvalidate.01" content="D5508E6BA3D06463667BF5C866B33007" />
        <meta name="color-scheme" content="dark light" />

        <script>
            try {
                const saved = localStorage.getItem("darkMode");
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

                if (saved === "true" || (saved === null && prefersDark)) {
                    document.documentElement.classList.add("dark");
                }
            } catch {}
        </script>

        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover" class="overscroll-none">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
